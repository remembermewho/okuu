# Прод на одном VPS: caddy (HTTPS, статика приложения и лендинга) → app (API, вебхуки, фоновые задачи) →
# postgres (том pgdata). Пошагово — docs/DEPLOY.md. Запуск из корня репозитория:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Переменные — в deploy/.env (образец — deploy/.env.prod.example, chmod 600, в git не попадает); compose
# читает его сам, рядом с этим файлом.
#
# Наружу открыты только 80 и 443 у caddy. У postgres и app портов нет: Docker публикует порты в обход ufw,
# поэтому база и API доступны только из своих сетей (db — без выхода в интернет, edge — caddy и app).

name: okuu-prod

x-logging: &logging
  # Логи контейнеров — с ротацией, чтобы не заполнить диск.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okuu}
      POSTGRES_USER: ${POSTGRES_USER:-okuu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - db
    logging: *logging
    # ports: нет — база доступна только из сети db (бэкап и psql — через docker compose exec)

  app:
    build:
      context: ../backend
    # Имя образа — фиксированное: на него ссылаются deploy/update.sh (метка :prev для отката) и docs/DEPLOY.md.
    image: okuu-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Задано здесь, а не в .env: в проде только так (environment сильнее env_file).
      APP_ENV: prod
      TELEGRAM_MODE: webhook
      HTTP_ADDR: ":8080"
      APP_ORIGIN: https://${APP_DOMAIN:?задайте APP_DOMAIN в deploy/.env}
      DATABASE_URL: postgres://${POSTGRES_USER:-okuu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-okuu}?sslmode=disable
      # X-Forwarded-For принимаем только от Caddy (сеть edge).
      TRUSTED_PROXIES: 172.30.0.0/24
      # Регистрация центров — только по ссылке, онлайн-оплата выключена (до Finik). Поменять — в deploy/.env.
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      ONLINE_PAYMENTS_ENABLED: ${ONLINE_PAYMENTS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db
      - edge # и Caddy, и выход в интернет (Telegram API)
    stop_grace_period: 30s # сервер сам ждёт текущие запросы и задачи до 20 с
    logging: *logging
    # ports: нет — API снаружи только через Caddy. Healthcheck — в образе (GET /readyz).

  caddy:
    # Caddy + собранные фронтенд и лендинг (deploy/caddy.Dockerfile). Адреса для лендинга — из доменов.
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
      args:
        SITE_URL: https://${LANDING_DOMAIN:?задайте LANDING_DOMAIN в deploy/.env}
        APP_URL: https://${APP_DOMAIN:?задайте APP_DOMAIN в deploy/.env}
    image: okuu-web:latest # как у app — фиксированное имя (deploy/update.sh, docs/DEPLOY.md)
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?задайте APP_DOMAIN в deploy/.env}
      LANDING_DOMAIN: ${LANDING_DOMAIN:?задайте LANDING_DOMAIN в deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      # Сертификаты Let's Encrypt — в томе: переживают пересборку и перезапуск.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
    logging: *logging

networks:
  db:
    internal: true # без выхода наружу: только postgres и app
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
