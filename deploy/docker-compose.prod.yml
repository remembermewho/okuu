# Прод на одном VPS: caddy (HTTPS, статика фронтенда) → app (API) → postgres (том).
# Запуск из корня репозитория:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Переменные — в deploy/.env (образец — deploy/.env.example); compose читает его сам, рядом
# с этим файлом. Порт Postgres наружу не открыт,
# app снаружи доступен только через Caddy.

name: okuu

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okuu}
      POSTGRES_USER: ${POSTGRES_USER:-okuu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - db
    # ports: нет — база доступна только из сети db

  app:
    build:
      context: ../backend
    image: ${APP_IMAGE:-okuu-app:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: prod
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-okuu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-okuu}?sslmode=disable
      # X-Forwarded-For принимаем только от Caddy (сеть edge).
      TRUSTED_PROXIES: 172.30.0.0/24
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db
      - edge # и Caddy, и выход в интернет (Telegram API)
    stop_grace_period: 30s # сервер сам ждёт текущие запросы и задачи до 20 с

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сборка фронтенда: cd frontend && npm ci && npm run build → frontend/dist (см. README).
      # Обновили сборку — Caddy отдаёт новые файлы сразу, перезапуск не нужен.
      - ../frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge

networks:
  db:
    internal: true # без выхода наружу: только postgres и app
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
