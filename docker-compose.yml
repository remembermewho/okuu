services:
  db:
    image: postgres:16-alpine
    container_name: okuu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: okuu
      POSTGRES_USER: okuu
      POSTGRES_PASSWORD: okuu_dev_password
    ports:
      - "5433:5432"   # на компьютере порт 5433, чтобы не конфликтовать с другим Postgres
    volumes:
      - okuu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okuu -d okuu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  okuu_pgdata:
