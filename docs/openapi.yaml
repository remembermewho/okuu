  # ---------------------------------------------------------------- students
  /api/v1/c/{centerId}/students:
    parameters:
      - $ref: '#/components/parameters/CenterId'
    get:
      tags: [students]
      operationId: listStudents
      summary: Ученики с балансом
      description: '**Роли:** owner, admin. По алфавиту, постранично.'
      security: [{ cookieAuth: [] }]
      parameters:
        - name: q
          in: query
          description: Поиск по ФИО или телефону родителя (от 3 цифр)
          schema: { type: string }
        - name: group
          in: query
          description: id группы — только с активной записью в неё
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StudentStatus' }
        - name: tg
          in: query
          description: Статус связи родителя с Telegram-ботом
          schema: { $ref: '#/components/schemas/TgStatus' }
        - name: hide_left
          in: query
          description: 'true — без ушедших (список по умолчанию в интерфейсе); не действует, если задан `status`'
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [students]
      operationId: createStudent
      summary: Создать ученика (и родителя)
      description: |
        **Роли:** owner, admin. Родитель с тем же телефоном в центре переиспользуется
        (`parent_existing = true`) — так у родителя бывает несколько детей.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStudentRequest' }
      responses:
        '201':
          description: Карточка ученика
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedStudent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/c/{centerId}/students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [students]
      operationId: getStudent
      summary: Карточка ученика
      description: '**Роли:** owner, admin. Родитель, все записи в группы, баланс.'
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [students]
      operationId: patchStudent
      summary: Изменить ученика и его родителя
      description: |
        **Роли:** owner, admin. `status = left` завершает активные записи датой `left_date` (по умолчанию — сегодня). Смена телефона родителя
        отвязывает его от Telegram (нужно новое приглашение). Изменения родителя видны у всех его детей.
        Фиксированная скидка больше цены любого активного тарифа ученика — `422 validation` (поле `discount`).
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchStudentRequest' }
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`parent_phone_taken` — телефон уже у другого родителя в центре'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/c/{centerId}/students/{studentId}/enrollments:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [students]
      operationId: createEnrollment
      summary: Записать в группу
      description: |
        **Роли:** owner, admin. Месячный тариф — начисление за текущий месяц по `first_month` (R5):
        `full` — цена со скидкой, `manual` — `manual_amount`, `none` — не начислять. Абонемент —
        начисление на его цену и `lessons_left = lessons_count` (R8). `charge = null` — не начислено.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '201':
          description: Запись и начисление
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `already_enrolled` — уже есть активная запись в эту группу;
            `student_left` — ученик ушёл, сначала верните статус
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/c/{centerId}/students/{studentId}/enrollments/{enrollmentId}/end:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      tags: [students]
      operationId: endEnrollment
      summary: Завершить запись
      description: '**Роли:** owner, admin. Тело необязательно: без `end_date` — сегодня. **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.'
      security: [{ cookieAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndEnrollmentRequest' }
      responses:
        '200':
          description: Запись
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`enrollment_ended` — запись уже завершена'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/c/{centerId}/students/{studentId}/enrollments/{enrollmentId}/renew:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/EnrollmentId'
    post:
      tags: [students]
      operationId: renewEnrollment
      summary: Продлить абонемент
      description: |
        **Роли:** owner, admin. Новое начисление на цену тарифа; к остатку добавляется `lessons_count`
        (минусовые занятия вычитаются из нового, R10).
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Запись и начисление
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `enrollment_ended` — запись завершена; `not_package` — тариф записи не абонемент;
            `student_left` — ученик ушёл
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/c/{centerId}/parents/{parentId}/invite:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/ParentId'
    post:
      tags: [students]
      operationId: createParentInvite
      summary: Пригласить родителя в Telegram-бот
      description: |
        **Роли:** owner, admin. Одноразовая ссылка на бота (30 дней) и готовый текст для WhatsApp
        на русском и кыргызском; `whatsapp_url` — на языке родителя.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      responses:
        '201':
          description: Приглашение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParentInvite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`telegram_not_configured` — бот не настроен (нет TELEGRAM_BOT_USERNAME); `demo_center` — демо-центр, Telegram не подключается'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- money
  /api/v1/c/{centerId}/students/{studentId}/payments:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [money]
      operationId: createOperation
      summary: Оплата, возврат или поправка
      description: |
        **Роли:** owner, admin. `payment` и `refund` — `amount > 0` и `method` (cash, transfer, card);
        `correction` — `amount` со знаком (≠ 0) и обязательный `comment`. Оплата зачисляется на баланс
        (R13), возврат его уменьшает (R16). Заголовок `Idempotency-Key` обязателен: повтор с тем же
        ключом и теми же данными — `200` с той же операцией, с другими данными — `422 idempotency_mismatch`.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '201':
          description: Операция создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '200':
          description: Повтор с тем же Idempotency-Key — та же операция
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`idempotency_mismatch` — ключ уже использован для другой операции'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/c/{centerId}/students/{studentId}/ledger:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [money]
      operationId: studentLedger
      summary: История операций ученика
      description: '**Роли:** owner, admin. Новые сверху, отменённые — тоже (с `cancelled = true`).'
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница истории
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/c/{centerId}/ledger/{ledgerId}/cancel:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/LedgerId'
    post:
      tags: [money]
      operationId: cancelOperation
      summary: Отменить операцию
      description: |
        **Роли:** owner, admin; оплату Finik — только owner (R15). Операции не удаляются и не
        редактируются — только отмена с причиной.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200':
          description: Отменённая операция
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`forbidden` — роль не подходит или оплату Finik отменяет не владелец; `bad_origin`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`already_cancelled` — операция уже отменена'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/c/{centerId}/debtors:
    parameters:
      - $ref: '#/components/parameters/CenterId'
    get:
      tags: [money]
      operationId: listDebtors
      summary: Должники и итоги месяца
      description: |
        **Роли:** owner, admin. `status=overdue` (по умолчанию) — должники: баланс < 0 и срок самого старого
        непогашенного начисления прошёл (R14), по убыванию долга. `status=pending` — «ожидают оплаты»: баланс < 0,
        срок ещё не наступил (или сегодня), по ближайшему сроку; `due_in_days` — дней до срока. Фильтр `group`
        работает в обоих. `summary` — по всему центру (без фильтра `group`), одинаковый для обоих списков.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: group
          in: query
          description: id группы — ученики, у которых была запись в неё
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: 'overdue — просрочено (по умолчанию), pending — ожидают оплаты'
          schema: { type: string, enum: [overdue, pending], default: overdue }
      responses:
        '200':
          description: Должники
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtorsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/c/{centerId}/reminders:
    parameters:
      - $ref: '#/components/parameters/CenterId'
    post:
      tags: [money]
      operationId: sendReminders
      summary: «Напомнить» в Telegram
      description: |
        **Роли:** owner, admin. По выбранным ученикам (`student_ids`, до 500) или по всем должникам
        (`all: true`). Дети одного родителя — одним сообщением (R18); об ученике — не чаще раза в час (R17).
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemindersRequest' }
      responses:
        '200':
          description: Итог
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemindersResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`telegram_not_configured` — бот не запущен (нет TELEGRAM_BOT_TOKEN); `demo_center` — демо-центр, напоминания не отправляются'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- attendance
  /api/v1/c/{centerId}/students/{studentId}/attendance:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [attendance]
      operationId: studentAttendance
      summary: Посещения ученика за месяц
      description: '**Роли:** owner, admin.'
      security: [{ cookieAuth: [] }]
      parameters:
        - name: month
          in: query
          description: Месяц ГГГГ-ММ; по умолчанию — текущий в поясе центра
          schema: { $ref: '#/components/schemas/MonthString' }
      responses:
        '200':
          description: Отметки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceHistoryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/c/{centerId}/lessons:
    parameters:
      - $ref: '#/components/parameters/CenterId'
    get:
      tags: [attendance]
      operationId: listLessons
      summary: Занятия на дату
      description: |
        **Роли:** owner, admin, teacher (свои группы, с сегодня − 7 дней по сегодня). Занятия по расписанию
        создаются при первом открытии даты (R11). Владелец и админ — до 30 дней вперёд.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Занятия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [attendance]
      operationId: createLesson
      summary: Внеплановое занятие
      description: '**Роли:** owner, admin. **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.'
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLessonRequest' }
      responses:
        '201':
          description: Занятие
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`lesson_exists` — у группы уже есть занятие в это время'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/c/{centerId}/lessons/{lessonId}:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/LessonId'
    patch:
      tags: [attendance]
      operationId: patchLesson
      summary: Отменить / вернуть занятие
      description: '**Роли:** owner, admin. Отменённое занятие ничего не списывает; отметки снимаются (R11). **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.'
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchLessonRequest' }
      responses:
        '200':
          description: Занятие
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/c/{centerId}/lessons/{lessonId}/attendance:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/LessonId'
    get:
      tags: [attendance]
      operationId: getLessonAttendance
      summary: Занятие с учениками и отметками
      description: '**Роли:** owner, admin, teacher (своя группа). Преподаватель не видит `has_debt`.'
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Занятие
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [attendance]
      operationId: putAttendance
      summary: Сохранить отметки
      description: |
        **Роли:** owner, admin, teacher (своя группа и только за 7 дней, R12). Пакетно; `status = null` —
        снять отметку. «Был»/«не был» списывают занятие с абонемента, «уважительная» — по настройке (R9).
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkRequest' }
      responses:
        '200':
          description: Занятие с новыми отметками
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`forbidden` — роль, чужая группа или преподаватель за пределами 7 дней; `bad_origin`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`lesson_cancelled` — занятие отменено'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------- import
  /api/v1/c/{centerId}/import/template.xlsx:
    parameters:
      - $ref: '#/components/parameters/CenterId'
    get:
      tags: [import]
      operationId: importTemplate
      summary: Шаблон импорта
      description: '**Роли:** owner, admin. Лист «Ученики» (заголовки + пример) и «Справка» (тарифы и группы центра).'
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Файл okuu-import.xlsx
          headers:
            Content-Disposition: { $ref: '#/components/headers/Attachment' }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Binary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/c/{centerId}/import/preview:
    parameters:
      - $ref: '#/components/parameters/CenterId'
    post:
      tags: [import]
      operationId: importPreview
      summary: Разобрать файл импорта
      description: |
        **Роли:** owner, admin. `multipart/form-data`, поле `file`: .xlsx или .csv (UTF-8 / windows-1251,
        разделитель `,` или `;`) до 5 МБ и 2000 строк. Ничего не сохраняет, кроме превью (на час).
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '200':
          description: Превью
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: '`file_too_large` — файл больше 5 МБ (поле `file`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/c/{centerId}/import/commit:
    parameters:
      - $ref: '#/components/parameters/CenterId'
    post:
      tags: [import]
      operationId: importCommit
      summary: Подтвердить импорт
      description: |
        **Роли:** owner, admin. Одной транзакцией: строки ok/warning без дубликатов. `first_month` — текущий
        месяц для месячных тарифов (R5): `full` — начислить по тарифу, `none` — не начислять (ручной суммы у
        импорта нет). Начальный долг — поправкой со сроком в день импорта.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCommitRequest' }
      responses:
        '200':
          description: Итоги
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`import_already_committed` — этот импорт уже подтверждён'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: '`import_expired` — превью устарело (хранится час)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- admin (суперадмин платформы)
  /api/v1/admin/centers:
    get:
      tags: [admin]
      operationId: adminListCenters
      summary: Центры платформы
      description: |
        **Только суперадмин** (остальным, в том числе без входа, — `404`). Поиск `q` — по названию центра,
        имени и телефону владельца; `status` — фильтр. Заявки (`pending`) — сверху. Только агрегаты:
        ученики, родители, операции и журналы центров в панели не видны.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CenterStatus' } }
      responses:
        '200':
          description: Центры
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCenterList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/AdminNotFound' }

  /api/v1/admin/centers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    get:
      tags: [admin]
      operationId: adminGetCenter
      summary: Карточка центра
      description: '**Только суперадмин.** Агрегаты (ученики по статусам, группы, сотрудники, родители в Telegram) и журнал платформы по центру.'
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCenterCard' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
    patch:
      tags: [admin]
      operationId: adminPatchCenter
      summary: Тариф и «оплачено до»
      description: |
        **Только суперадмин.** `paid_until = null` — не задано. Просроченная оплата центр **не** блокирует —
        только подсвечивается (`payment_overdue`). **Origin:** обязателен заголовок `Origin` = `APP_ORIGIN`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPatchCenterRequest' }
      responses:
        '200':
          description: Обновлённая карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCenterCard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '404': { $ref: '#/components/responses/AdminNotFound' }

  /api/v1/admin/centers/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    post:
      tags: [admin]
      operationId: adminApproveCenter
      summary: Одобрить заявку
      description: '**Только суперадмин.** `pending` → `active`. **Origin:** обязателен заголовок `Origin` = `APP_ORIGIN`.'
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Обновлённая карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCenterCard' }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/CenterStatusConflict' }

  /api/v1/admin/centers/{id}/block:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    post:
      tags: [admin]
      operationId: adminBlockCenter
      summary: Приостановить доступ
      description: |
        **Только суперадмин.** `pending` или `active` → `blocked`; причина обязательна (видна только в панели).
        Сотрудники центра получают `403 center_blocked`, бот и напоминания центра останавливаются.
        **Origin:** обязателен заголовок `Origin` = `APP_ORIGIN`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Обновлённая карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCenterCard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/CenterStatusConflict' }

  /api/v1/admin/centers/{id}/unblock:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    post:
      tags: [admin]
      operationId: adminUnblockCenter
      summary: Вернуть доступ
      description: '**Только суперадмин.** `blocked` → `active`. **Origin:** обязателен заголовок `Origin` = `APP_ORIGIN`.'
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Обновлённая карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCenterCard' }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/CenterStatusConflict' }

  /api/v1/admin/centers/{id}/owner-password-reset:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    post:
      tags: [admin]
      operationId: adminOwnerPasswordReset
      summary: Ссылка сброса пароля владельца
      description: |
        **Только суперадмин.** Одноразовая ссылка на 24 часа (прежние ссылки владельца перестают работать).
        Заменяет консольную `server user reset-link` — та остаётся для аварий. **Origin:** обязателен `Origin`.
      security: [{ cookieAuth: [] }]
      responses:
        '201':
          description: Ссылка — передайте владельцу лично
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerReset' }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409':
          description: '`no_owner` — у центра нет владельца'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/registration-links:
    get:
      tags: [admin]
      operationId: adminListRegistrationLinks
      summary: Ссылки регистрации центров
      description: '**Только суперадмин.** Новые сверху; сама ссылка не хранится — только её хэш.'
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Ссылки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationLinkList' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
    post:
      tags: [admin]
      operationId: adminCreateRegistrationLink
      summary: Создать ссылку регистрации
      description: |
        **Только суперадмин.** Одноразовая ссылка `{APP_ORIGIN}/register/{токен}` на 14 дней; `note` — для кого.
        `url` есть только в этом ответе. **Origin:** обязателен заголовок `Origin` = `APP_ORIGIN`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              additionalProperties: false
              properties:
                note: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: Ссылка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedRegistrationLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '404': { $ref: '#/components/responses/AdminNotFound' }

  /api/v1/admin/registration-links/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    delete:
      tags: [admin]
      operationId: adminRevokeRegistrationLink
      summary: Отозвать ссылку регистрации
      description: '**Только суперадмин.** Только неиспользованную. **Origin:** обязателен заголовок `Origin` = `APP_ORIGIN`.'
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Отозвана }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409':
          description: '`registration_link_closed` — ссылка уже использована или отозвана'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/audit:
    get:
      tags: [admin]
      operationId: adminListAudit
      summary: Журнал платформы
      description: '**Только суперадмин.** Действия суперадмина и консольных команд, новые сверху.'
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Записи
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAuditList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/AdminNotFound' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: okuu_session
      description: Сессия; ставят register, login и invites/{token}/accept.

  headers:
    SetSession:
      description: '`okuu_session=<токен>; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000` (в prod — Secure)'
      schema: { type: string }
    RetryAfter:
      description: Через сколько секунд можно повторить
      schema: { type: integer, minimum: 1 }
    Attachment:
      description: '`attachment; filename="…xlsx"`'
      schema: { type: string }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Уникальный ключ операции (например, UUID), 1–100 символов. Повтор запроса с тем же ключом не создаёт вторую операцию.'
      schema: { type: string, minLength: 1, maxLength: 100 }
    Token:
      name: token
      in: path
      required: true
      description: Токен из ссылки (43 символа base64url)
      schema: { type: string }
    CenterId:
      name: centerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StudentId:
      name: studentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TariffId:
      name: tariffId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LedgerId:
      name: ledgerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ParentId:
      name: parentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Размер страницы (по умолчанию 50)
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: '`next_cursor` из прошлого ответа'
      schema: { type: string }
    Archived:
      name: archived
      in: query
      description: true — архивные, false (по умолчанию) — активные
      schema: { type: boolean, default: false }
    Month:
      name: m
      in: query
      description: Месяц ГГГГ-ММ; по умолчанию — текущий в поясе центра
      schema: { $ref: '#/components/schemas/MonthString' }

  responses:
    AdminNotFound:
      description: '`not_found` — нет такого центра или ссылки; так же отвечают всем, кто не суперадмин (и без входа)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CenterStatusConflict:
      description: '`center_status_conflict` — действие не подходит к текущему статусу центра (уже одобрен, уже заблокирован…)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: |
        `validation` — неверное значение поля (`field` — какого); `bad_request` — тело не JSON,
        в нём лишние поля или несколько объектов
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: '`validation` — значение допустимо само по себе, но не подходит по смыслу (ссылка на чужую группу, дата в будущем и т. п.); `field` — поле'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '`unauthorized` — нет сессии или она истекла'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadOrigin:
      description: '`bad_origin` — заголовок Origin не совпадает с адресом фронтенда'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`forbidden` — роль не подходит для операции; `center_pending` — заявка центра ещё не одобрена; `center_blocked` — доступ к центру приостановлен; `bad_origin` — неверный Origin (изменяющие запросы)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`not_found` — центра нет среди ваших, или нет сущности в этом центре (некорректный id — тоже 404)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: '`too_many_requests` — больше 30 запросов в минуту с одного IP'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StaffConflict:
      description: |
        `owner_protected` — владельца нельзя удалить;
        `teacher_has_groups` — у преподавателя есть активные группы: сначала назначьте им другого
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------------------------------------------------------------- общие
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Машинный код — список в docs/errors.md
              examples: [validation]
            message:
              type: string
              description: Сообщение для человека, по-русски
            field:
              type: string
              description: Поле запроса (у validation)
    Money:
      type: integer
      format: int64
      description: Тыйыны (1 сом = 100 тыйын)
    UUID:
      type: string
      format: uuid
    NullableUUID:
      type: [string, 'null']
      format: uuid
    Date:
      type: string
      format: date
    NullableDate:
      type: [string, 'null']
      format: date
    DateTime:
      type: string
      format: date-time
    NullableDateTime:
      type: [string, 'null']
      format: date-time
    MonthString:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      examples: ['2026-10']
    TimeOfDay:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      examples: ['16:00']
    Binary:
      type: string
      contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    NextCursor:
      type: [string, 'null']
      description: null — страница последняя
    Ref:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
    Role:
      type: string
      enum: [owner, admin, teacher]
    StudentStatus:
      type: string
      enum: [active, paused, left]
    TgStatus:
      type: string
      enum: [none, active, stopped, blocked]
      description: 'none — не подключён; active — подключён; stopped — отключил уведомления (/stop); blocked — заблокировал бота'
    Phone:
      type: string
      description: 'Телефон КР: +996XXXXXXXXX или 0XXXXXXXXX (пробелы, дефисы, скобки допустимы)'
      examples: ['0700 123 456']
    Discount:
      type: object
      required: [kind, value]
      additionalProperties: false
      description: 'fixed — сом в тыйынах, не больше цены (иначе начисление 0); percent — 1..100'
      properties:
        kind: { type: string, enum: [fixed, percent] }
        value: { type: integer, format: int64, minimum: 0 }
    NullableDiscount:
      oneOf:
        - { $ref: '#/components/schemas/Discount' }
        - { type: 'null' }

    # ---------------------------------------------------------------- auth, staff
    Me:
      type: object
      required: [id, name, phone, centers, is_platform_admin]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        phone: { type: string, examples: ['+996700123456'] }
        is_platform_admin:
          type: boolean
          description: Суперадмин платформы — в интерфейсе виден раздел `/admin`
        centers:
          type: array
          items:
            type: object
            required: [id, name, role, status, today]
            additionalProperties: false
            properties:
              id: { $ref: '#/components/schemas/UUID' }
              name: { type: string }
              role: { $ref: '#/components/schemas/Role' }
              status: { $ref: '#/components/schemas/CenterStatus' }
              today:
                $ref: '#/components/schemas/Date'
                description: '«Сегодня» в часовом поясе центра — по нему интерфейс считает окно дат посещаемости'
    CenterStatus:
      type: string
      enum: [pending, active, blocked]
      description: '`pending` — заявка ждёт одобрения, `blocked` — доступ приостановлен; в обоих данные центра недоступны'
    Plan:
      type: string
      enum: [free, start, center, network, founder]
      description: 'Тариф сервиса: free (до 30 учеников), start (до 100), center (до 300), network (сеть), founder (первые клиенты)'
    AdminCenter:
      type: object
      required: [id, name, status, blocked_reason, plan, paid_until, payment_overdue, is_demo, created_at, owner, active_students, last_activity]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        status: { $ref: '#/components/schemas/CenterStatus' }
        blocked_reason: { type: [string, 'null'], description: 'Причина блокировки — видна только в панели' }
        plan: { $ref: '#/components/schemas/Plan' }
        paid_until: { $ref: '#/components/schemas/NullableDate' }
        payment_overdue: { type: boolean, description: '«Оплачено до» прошло (по Бишкеку). Центр при этом не блокируется' }
        is_demo: { type: boolean }
        created_at: { $ref: '#/components/schemas/DateTime' }
        owner:
          type: object
          required: [name, phone]
          additionalProperties: false
          properties:
            name: { type: string }
            phone: { type: string }
        active_students: { type: integer }
        last_activity:
          type: [string, 'null']
          format: date-time
          description: Последний вход любого сотрудника центра; `null` — не входили
    AdminCenterList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminCenter' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    AdminCenterCard:
      description: Поля `AdminCenter` и агрегаты для карточки
      type: object
      required: [id, name, status, blocked_reason, plan, paid_until, payment_overdue, is_demo, created_at, owner, active_students, last_activity,
                 timezone, students, groups, staff, telegram_parents, audit]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        status: { $ref: '#/components/schemas/CenterStatus' }
        blocked_reason: { type: [string, 'null'] }
        plan: { $ref: '#/components/schemas/Plan' }
        paid_until: { $ref: '#/components/schemas/NullableDate' }
        payment_overdue: { type: boolean }
        is_demo: { type: boolean }
        created_at: { $ref: '#/components/schemas/DateTime' }
        owner:
          type: object
          required: [name, phone]
          additionalProperties: false
          properties:
            name: { type: string }
            phone: { type: string }
        active_students: { type: integer }
        last_activity: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        students:
          type: object
          required: [active, paused, left]
          additionalProperties: false
          properties:
            active: { type: integer }
            paused: { type: integer }
            left: { type: integer }
        groups: { type: integer, description: 'Активных групп' }
        staff: { type: integer, description: 'Сотрудников, включая владельца' }
        telegram_parents: { type: integer, description: 'Родителей, подключённых к боту' }
        audit: { type: array, items: { $ref: '#/components/schemas/PlatformAuditEntry' } }
    AdminPatchCenterRequest:
      type: object
      required: [plan, paid_until]
      additionalProperties: false
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        paid_until: { $ref: '#/components/schemas/NullableDate' }
    AdminOwnerReset:
      type: object
      required: [url, user_name, expires_at]
      additionalProperties: false
      properties:
        url: { type: string, examples: ['https://app.okuu.kg/reset/abc'] }
        user_name: { type: string }
        expires_at: { $ref: '#/components/schemas/DateTime' }
    RegistrationLink:
      type: object
      required: [id, note, status, created_at, expires_at, used_at, revoked_at, center, created_by_name]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        note: { type: string, description: Для кого }
        status: { type: string, enum: [active, used, revoked, expired] }
        created_at: { $ref: '#/components/schemas/DateTime' }
        expires_at: { $ref: '#/components/schemas/DateTime' }
        used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        center:
          description: Центр, зарегистрированный по ссылке
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              additionalProperties: false
              properties:
                id: { $ref: '#/components/schemas/UUID' }
                name: { type: string }
        created_by_name: { type: [string, 'null'], description: '`null` — консольная команда' }
    RegistrationLinkList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RegistrationLink' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    IssuedRegistrationLink:
      type: object
      required: [id, note, url, expires_at]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        note: { type: string }
        url: { type: string, description: 'Ссылка `{APP_ORIGIN}/register/{токен}` — только в этом ответе', examples: ['https://app.okuu.kg/register/abc'] }
        expires_at: { $ref: '#/components/schemas/DateTime' }
    PlatformAuditEntry:
      type: object
      required: [id, at, action, admin_name, center_id, center_name, details]
      additionalProperties: false
      properties:
        id: { type: integer }
        at: { $ref: '#/components/schemas/DateTime' }
        action:
          type: string
          description: 'center.approve, center.block, center.unblock, center.plan, center.owner_password_reset, registration_link.create, registration_link.revoke, admin.grant, admin.revoke'
        admin_name: { type: [string, 'null'], description: '`null` — консольная команда' }
        center_id: { $ref: '#/components/schemas/NullableUUID' }
        center_name: { type: [string, 'null'] }
        details: { type: [object, 'null'], description: 'Подробности действия (причина, тариф до/после, для кого ссылка)' }
    PlatformAuditList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlatformAuditEntry' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    RegistrationInfo:
      type: object
      required: [mode, support_whatsapp]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [invite, approval, open]
          description: '`invite` — только по ссылке, `approval` — заявка с одобрением, `open` — свободно'
        support_whatsapp:
          type: [string, 'null']
          description: Номер поддержки для `https://wa.me/<номер>` (только цифры); `null` — не задан
          examples: ['996700123456']
    RegisterRequest:
      type: object
      required: [phone, password, name, center_name]
      additionalProperties: false
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        password: { type: string, minLength: 8, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 100 }
        center_name: { type: string, minLength: 1, maxLength: 100 }
        registration_token:
          type: string
          description: Токен из ссылки `{APP_ORIGIN}/register/{токен}`; в режиме `invite` обязателен
    LoginRequest:
      type: object
      required: [phone, password]
      additionalProperties: false
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        password: { type: string }
    PatchMeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 128 }
    NewPasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      properties:
        new_password: { type: string, minLength: 8, maxLength: 128 }
    PasswordResetLink:
      type: object
      required: [url, name, expires_at]
      additionalProperties: false
      properties:
        url: { type: string, format: uri, description: 'APP_ORIGIN/reset/<токен> — показать один раз' }
        name: { type: string, description: 'Имя сотрудника' }
        expires_at: { $ref: '#/components/schemas/DateTime' }
    PublicPasswordReset:
      type: object
      required: [name, center_name]
      additionalProperties: false
      properties:
        name: { type: string, description: 'Имя пользователя' }
        center_name: { type: [string, 'null'], description: 'Центр, выдавший ссылку; null — поддержка' }
    PublicInvite:
      type: object
      required: [center_name, role, name, expires_at]
      additionalProperties: false
      properties:
        center_name: { type: string }
        role: { type: string, enum: [admin, teacher] }
        name: { type: [string, 'null'], description: 'Имя, которое указал владелец' }
        expires_at: { $ref: '#/components/schemas/DateTime' }
    AcceptInviteRequest:
      type: object
      additionalProperties: false
      description: Только для нового пользователя (без сессии)
      properties:
        name: { type: string, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        password: { type: string, minLength: 8, maxLength: 128 }
    StaffMember:
      type: object
      required: [user_id, name, phone, role]
      additionalProperties: false
      properties:
        user_id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        phone: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    StaffList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffMember' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    InviteFields:
      type: object
      required: [id, role, name, expires_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        role: { type: string, enum: [admin, teacher] }
        name: { type: [string, 'null'] }
        expires_at: { $ref: '#/components/schemas/DateTime' }
        created_at: { $ref: '#/components/schemas/DateTime' }
    Invite:
      allOf: [{ $ref: '#/components/schemas/InviteFields' }]
      unevaluatedProperties: false
    CreatedInvite:
      allOf:
        - { $ref: '#/components/schemas/InviteFields' }
        - type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
              description: 'APP_ORIGIN/invite/<токен> — показать один раз'
      unevaluatedProperties: false
    InviteList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invite' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateInviteRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { type: string, enum: [admin, teacher] }
        name: { type: string, maxLength: 100, description: 'Кого приглашают — подсказка на странице приглашения' }
    ChangeRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { type: string, enum: [admin, teacher] }

    # ---------------------------------------------------------------- settings, reports, audit
    Settings:
      type: object
      required: [name, phone, timezone, billing_day, billing_day_next, billing_day_next_from, due_days,
                 excused_deducts, reminders_on, overdue_repeat, notify_absent, pay_details, plan, finik_connected]
      additionalProperties: false
      properties:
        name: { type: string }
        phone: { type: [string, 'null'] }
        timezone: { type: string, examples: [Asia/Bishkek] }
        billing_day: { type: integer, minimum: 1, maximum: 28, description: 'Действует сейчас' }
        billing_day_next: { type: [integer, 'null'], description: 'Новый день, ещё не вступивший в силу' }
        billing_day_next_from: { $ref: '#/components/schemas/NullableDate' }
        due_days: { type: integer, minimum: 0, maximum: 60 }
        excused_deducts: { type: boolean, description: '«Уважительная» списывает занятие с абонемента' }
        reminders_on: { type: boolean, description: 'Автонапоминания о долге' }
        overdue_repeat:
          type: string
          enum: [weekly, off]
          description: 'weekly — после 7-го дня просрочки, пока долг не оплачен, напоминать раз в 7 дней (14, 21, 28…); off — дальше только вручную'
        notify_absent: { type: boolean, description: 'Сообщать родителю «не был на занятии»' }
        pay_details: { type: [string, 'null'], description: 'Реквизиты — в напоминаниях, пока нет Finik' }
        plan: { $ref: '#/components/schemas/Plan' }
        finik_connected: { type: boolean }
    PatchSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: [string, 'null'] }
        timezone: { type: string, description: 'IANA, например Asia/Bishkek' }
        billing_day: { type: integer, minimum: 1, maximum: 28 }
        due_days: { type: integer, minimum: 0, maximum: 60 }
        excused_deducts: { type: boolean }
        reminders_on: { type: boolean }
        overdue_repeat: { type: string, enum: [weekly, off] }
        notify_absent: { type: boolean }
        pay_details: { type: [string, 'null'], maxLength: 1000 }
    MonthReport:
      type: object
      required: [month, period, period_end, charged, collected, refunds, collected_net, corrections, debt_end,
                 debt_end_note, debtors_end, students_active_end, joined, left]
      additionalProperties: false
      properties:
        month: { $ref: '#/components/schemas/MonthString' }
        period: { $ref: '#/components/schemas/Date' }
        period_end: { $ref: '#/components/schemas/Date' }
        charged: { $ref: '#/components/schemas/Money' }
        collected:
          type: object
          required: [total, cash, transfer, card, finik]
          additionalProperties: false
          properties:
            total: { $ref: '#/components/schemas/Money' }
            cash: { $ref: '#/components/schemas/Money' }
            transfer: { $ref: '#/components/schemas/Money' }
            card: { $ref: '#/components/schemas/Money' }
            finik: { $ref: '#/components/schemas/Money' }
        refunds: { $ref: '#/components/schemas/Money' }
        collected_net: { $ref: '#/components/schemas/Money' }
        corrections: { $ref: '#/components/schemas/Money' }
        debt_end: { $ref: '#/components/schemas/Money' }
        debt_end_note: { type: string }
        debtors_end: { type: integer }
        students_active_end: { type: integer }
        joined: { type: integer }
        left: { type: integer }
    AuditItem:
      type: object
      required: [id, at, user, user_name, action, entity, entity_id, before, after]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        at: { $ref: '#/components/schemas/DateTime' }
        user:
          oneOf:
            - type: object
              required: [id, name]
              additionalProperties: false
              properties:
                id: { $ref: '#/components/schemas/UUID' }
                name: { type: string }
            - type: 'null'
          description: null — система (фоновые задачи, бот)
        user_name: { type: string, description: '«Система», если user = null' }
        action: { type: string, examples: [ledger.cancel] }
        entity: { type: string }
        entity_id: { $ref: '#/components/schemas/NullableUUID' }
        before: { description: 'Состояние до (любой JSON или null)' }
        after: { description: 'Состояние после (любой JSON или null)' }
    AuditList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditItem' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    # ---------------------------------------------------------------- catalog
    TariffKind:
      type: string
      enum: [monthly, package]
    Tariff:
      type: object
      required: [id, name, kind, price, lessons_count, archived]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/TariffKind' }
        price: { $ref: '#/components/schemas/Money' }
        lessons_count: { type: [integer, 'null'], description: 'Занятий в абонементе; у месячного — null' }
        archived: { type: boolean }
    TariffList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Tariff' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateTariffRequest:
      type: object
      required: [name, kind, price]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/TariffKind' }
        price: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        lessons_count: { type: [integer, 'null'], minimum: 1 }
    PatchTariffRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/TariffKind' }
        price: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        lessons_count: { type: [integer, 'null'], minimum: 1 }
    Slot:
      type: object
      required: [dow, start, end]
      additionalProperties: false
      properties:
        dow: { type: integer, minimum: 1, maximum: 7, description: '1 — понедельник … 7 — воскресенье' }
        start: { $ref: '#/components/schemas/TimeOfDay' }
        end: { $ref: '#/components/schemas/TimeOfDay' }
    Group:
      type: object
      required: [id, name, teacher_id, teacher_name, schedule, default_tariff_id, archived, students_count]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        teacher_id: { $ref: '#/components/schemas/NullableUUID' }
        teacher_name: { type: [string, 'null'] }
        schedule: { type: array, items: { $ref: '#/components/schemas/Slot' } }
        default_tariff_id: { $ref: '#/components/schemas/NullableUUID' }
        archived: { type: boolean }
        students_count: { type: integer, description: 'Активных записей' }
    GroupList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        teacher_id: { $ref: '#/components/schemas/NullableUUID' }
        schedule: { type: [array, 'null'], items: { $ref: '#/components/schemas/Slot' } }
        default_tariff_id: { $ref: '#/components/schemas/NullableUUID' }
    PatchGroupRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        teacher_id: { $ref: '#/components/schemas/NullableUUID' }
        schedule: { type: array, items: { $ref: '#/components/schemas/Slot' } }
        default_tariff_id: { $ref: '#/components/schemas/NullableUUID' }

    # ---------------------------------------------------------------- students
    Parent:
      type: object
      required: [id, name, phone, tg_status, last_reminder_at]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        phone: { type: string }
        tg_status: { $ref: '#/components/schemas/TgStatus' }
        last_reminder_at: { $ref: '#/components/schemas/NullableDateTime' }
    NullableParent:
      oneOf:
        - { $ref: '#/components/schemas/Parent' }
        - { type: 'null' }
    Enrollment:
      type: object
      required: [id, group, tariff, start_date, end_date, lessons_left, billed_through, active]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        group: { $ref: '#/components/schemas/Ref' }
        tariff:
          type: object
          required: [id, name, kind, price]
          additionalProperties: false
          properties:
            id: { $ref: '#/components/schemas/UUID' }
            name: { type: string }
            kind: { $ref: '#/components/schemas/TariffKind' }
            price: { $ref: '#/components/schemas/Money' }
        start_date: { $ref: '#/components/schemas/Date' }
        end_date: { $ref: '#/components/schemas/NullableDate' }
        lessons_left: { type: [integer, 'null'], description: 'Остаток абонемента (может быть < 0, R10)' }
        billed_through: { $ref: '#/components/schemas/NullableDate' }
        active: { type: boolean }
    Charge:
      type: object
      required: [id, amount, list_price, discount, period, due_date]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        amount: { $ref: '#/components/schemas/Money' }
        list_price: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        period: { $ref: '#/components/schemas/NullableDate' }
        due_date: { $ref: '#/components/schemas/Date' }
    StudentFields:
      type: object
      required: [id, full_name, birth_date, status, discount, created_at, parent, enrollments, balance]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        full_name: { type: string }
        birth_date: { $ref: '#/components/schemas/NullableDate' }
        status: { $ref: '#/components/schemas/StudentStatus' }
        discount: { $ref: '#/components/schemas/NullableDiscount' }
        created_at: { $ref: '#/components/schemas/DateTime' }
        parent: { $ref: '#/components/schemas/NullableParent' }
        enrollments: { type: array, items: { $ref: '#/components/schemas/Enrollment' } }
        balance:
          type: integer
          format: int64
          description: Тыйыны; < 0 — долг, > 0 — аванс. Сумма неотменённых операций (R13)
    Student:
      allOf: [{ $ref: '#/components/schemas/StudentFields' }]
      unevaluatedProperties: false
    CreatedStudent:
      allOf:
        - { $ref: '#/components/schemas/StudentFields' }
        - type: object
          required: [parent_existing]
          properties:
            parent_existing: { type: boolean, description: 'Родитель с этим телефоном уже был в центре' }
      unevaluatedProperties: false
    StudentListItem:
      type: object
      required: [id, full_name, birth_date, status, discount, parent, groups, balance]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        full_name: { type: string }
        birth_date: { $ref: '#/components/schemas/NullableDate' }
        status: { $ref: '#/components/schemas/StudentStatus' }
        discount: { $ref: '#/components/schemas/NullableDiscount' }
        parent: { $ref: '#/components/schemas/NullableParent' }
        groups: { type: array, items: { $ref: '#/components/schemas/Ref' }, description: 'Активные записи' }
        balance: { $ref: '#/components/schemas/Money' }
    StudentList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StudentListItem' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateStudentRequest:
      type: object
      required: [full_name, parent]
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1, maxLength: 100 }
        birth_date: { $ref: '#/components/schemas/NullableDate' }
        parent:
          type: object
          required: [name, phone]
          additionalProperties: false
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            phone: { $ref: '#/components/schemas/Phone' }
        discount: { $ref: '#/components/schemas/NullableDiscount' }
    PatchStudentRequest:
      type: object
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1, maxLength: 100 }
        birth_date: { $ref: '#/components/schemas/NullableDate' }
        status: { $ref: '#/components/schemas/StudentStatus' }
        left_date:
          $ref: '#/components/schemas/Date'
          description: |
            Последний день занятий — только вместе с `status = left` (без него — сегодня). Не раньше начала самой
            поздней активной записи и не позже сегодня + 30 дней. Активные записи закрываются этой датой
            (`end_date`), на занятиях после неё ученика нет.
        discount: { $ref: '#/components/schemas/NullableDiscount' }
        parent:
          type: object
          additionalProperties: false
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            phone: { $ref: '#/components/schemas/Phone' }
    EnrollRequest:
      type: object
      required: [group_id, start_date]
      additionalProperties: false
      properties:
        group_id: { $ref: '#/components/schemas/UUID' }
        tariff_id:
          $ref: '#/components/schemas/NullableUUID'
          description: 'По умолчанию — тариф группы'
        start_date:
          $ref: '#/components/schemas/Date'
          description: 'Не раньше чем 5 лет назад'
        first_month:
          type: string
          enum: [full, manual, none]
          default: full
          description: Только для месячного тарифа (R5)
        manual_amount:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: 'Тыйыны; обязателен при first_month = manual'
    EndEnrollmentRequest:
      type: object
      additionalProperties: false
      properties:
        end_date: { $ref: '#/components/schemas/NullableDate' }
    EnrollResult:
      type: object
      required: [enrollment, charge]
      additionalProperties: false
      properties:
        enrollment: { $ref: '#/components/schemas/Enrollment' }
        charge:
          oneOf:
            - { $ref: '#/components/schemas/Charge' }
            - { type: 'null' }
    ParentInvite:
      type: object
      required: [id, bot_url, expires_at, texts, lang, whatsapp_url, tg_status]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        bot_url: { type: string, format: uri, examples: ['https://t.me/okuu_bot?start=<токен>'] }
        expires_at: { $ref: '#/components/schemas/DateTime' }
        texts:
          type: object
          required: [ru, ky]
          additionalProperties: false
          properties:
            ru: { type: string }
            ky: { type: string }
        lang: { type: string, enum: [ru, ky] }
        whatsapp_url: { type: string, format: uri }
        tg_status: { $ref: '#/components/schemas/TgStatus' }

    # ---------------------------------------------------------------- money
    Operation:
      type: object
      required: [id, student_id, kind, amount, method, comment, enrollment_id, period, due_date, list_price,
                 discount, created_at, created_by, cancelled, cancelled_at, cancelled_by, cancel_reason]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        student_id: { $ref: '#/components/schemas/UUID' }
        kind: { type: string, enum: [charge, payment, refund, correction] }
        amount:
          type: integer
          format: int64
          description: 'Тыйыны со знаком: начисление и возврат < 0, оплата > 0, поправка — любой знак'
        method: { type: [string, 'null'], enum: [cash, transfer, card, finik, null] }
        comment: { type: [string, 'null'] }
        enrollment_id: { $ref: '#/components/schemas/NullableUUID' }
        period: { $ref: '#/components/schemas/NullableDate' }
        due_date: { $ref: '#/components/schemas/NullableDate' }
        list_price: { type: [integer, 'null'], format: int64 }
        discount: { type: [integer, 'null'], format: int64 }
        created_at: { $ref: '#/components/schemas/DateTime' }
        created_by:
          $ref: '#/components/schemas/NullableUUID'
          description: null — система (billing.monthly, онлайн-оплата)
        cancelled: { type: boolean }
        cancelled_at: { $ref: '#/components/schemas/NullableDateTime' }
        cancelled_by: { $ref: '#/components/schemas/NullableUUID' }
        cancel_reason: { type: [string, 'null'] }
    OperationList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Operation' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    OperationRequest:
      type: object
      required: [kind, amount]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [payment, refund, correction] }
        amount:
          type: integer
          format: int64
          description: 'Тыйыны: payment/refund > 0; correction — со знаком, ≠ 0'
        method:
          type: [string, 'null']
          enum: [cash, transfer, card, null]
          description: Обязателен у payment и refund; у correction — нет
        comment: { type: [string, 'null'], maxLength: 500, description: 'Обязателен у correction' }
    CancelRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    Debtor:
      type: object
      required: [student_id, full_name, status, groups, parent, debt, days_overdue, oldest_due_date, due_in_days, reminded_today]
      additionalProperties: false
      properties:
        student_id: { $ref: '#/components/schemas/UUID' }
        full_name: { type: string }
        status: { $ref: '#/components/schemas/StudentStatus' }
        groups: { type: array, items: { $ref: '#/components/schemas/Ref' } }
        parent:
          oneOf:
            - type: object
              required: [name, phone, tg_status, last_reminder_at]
              additionalProperties: false
              properties:
                name: { type: [string, 'null'] }
                phone: { type: [string, 'null'] }
                tg_status: { type: [string, 'null'] }
                last_reminder_at: { $ref: '#/components/schemas/NullableDateTime' }
            - type: 'null'
        debt: { type: integer, format: int64, minimum: 1, description: 'Тыйыны, > 0' }
        days_overdue: { type: integer, minimum: 0, description: '`overdue` — дней просрочки (≥ 1); `pending` — 0' }
        oldest_due_date:
          $ref: '#/components/schemas/Date'
          description: Самый ранний непогашенный срок (у «ожидают оплаты» — ближайший)
        due_in_days: { type: integer, minimum: 0, description: '`pending` — дней до срока (0 — срок сегодня); `overdue` — 0' }
        reminded_today: { type: boolean, description: 'Родителю сегодня (в поясе центра) уже напоминали — по `last_reminder_at`' }
    DebtorsResponse:
      type: object
      required: [items, next_cursor, summary]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Debtor' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
        summary:
          type: object
          required: [period, charged, collected, debt_total, debtors_count, pending_total, pending_count]
          additionalProperties: false
          properties:
            period: { $ref: '#/components/schemas/Date' }
            charged: { $ref: '#/components/schemas/Money' }
            collected: { $ref: '#/components/schemas/Money' }
            debt_total: { $ref: '#/components/schemas/Money' }
            debtors_count: { type: integer }
            pending_total:
              $ref: '#/components/schemas/Money'
              description: Долг, срок которого ещё не наступил
            pending_count: { type: integer }
    RemindersRequest:
      type: object
      additionalProperties: false
      description: 'Либо student_ids, либо all: true'
      properties:
        student_ids:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/UUID' }
        all: { type: boolean }
    RemindersResponse:
      type: object
      required: [sent, messages, skipped]
      additionalProperties: false
      properties:
        sent: { type: integer, description: 'Учеников, о которых напомнили' }
        messages: { type: integer, description: 'Сообщений родителям' }
        skipped:
          type: array
          items:
            type: object
            required: [student_id, reason]
            additionalProperties: false
            properties:
              student_id: { $ref: '#/components/schemas/UUID' }
              reason:
                type: string
                enum: [no_telegram, stopped, blocked, rate_limited, no_debt, send_failed]

    # ---------------------------------------------------------------- attendance
    AttendanceStatus:
      type: string
      enum: [present, absent, excused]
    Lesson:
      type: object
      required: [id, group, date, start_time, end_time, cancelled, students_count, marked_count, students]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        group: { $ref: '#/components/schemas/Ref' }
        date: { $ref: '#/components/schemas/Date' }
        start_time: { $ref: '#/components/schemas/TimeOfDay' }
        end_time:
          oneOf:
            - { $ref: '#/components/schemas/TimeOfDay' }
            - { type: 'null' }
          description: По расписанию; null — внеплановое
        cancelled: { type: boolean }
        students_count: { type: integer }
        marked_count: { type: integer }
        students:
          type: array
          items:
            type: object
            required: [student_id, full_name, status, lessons_left]
            additionalProperties: false
            properties:
              student_id: { $ref: '#/components/schemas/UUID' }
              full_name: { type: string }
              status:
                oneOf:
                  - { $ref: '#/components/schemas/AttendanceStatus' }
                  - { type: 'null' }
                description: null — не отмечен
              lessons_left: { type: [integer, 'null'], description: 'Только у абонемента' }
              has_debt: { type: boolean, description: 'Только для owner и admin' }
    LessonList:
      type: object
      required: [items, next_cursor, today]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Lesson' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
        today:
          $ref: '#/components/schemas/Date'
          description: '«Сегодня» в часовом поясе центра (окно дат: преподаватель — сегодня−7…сегодня, владелец и админ — до сегодня+30)'
    AttendanceHistoryList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [lesson_id, date, start_time, group, status, deducted]
            additionalProperties: false
            properties:
              lesson_id: { $ref: '#/components/schemas/UUID' }
              date: { $ref: '#/components/schemas/Date' }
              start_time: { $ref: '#/components/schemas/TimeOfDay' }
              group: { $ref: '#/components/schemas/Ref' }
              status: { $ref: '#/components/schemas/AttendanceStatus' }
              deducted: { type: boolean, description: 'Списало ли занятие с абонемента' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateLessonRequest:
      type: object
      required: [group_id, date, start_time]
      additionalProperties: false
      properties:
        group_id: { $ref: '#/components/schemas/UUID' }
        date: { $ref: '#/components/schemas/Date' }
        start_time: { $ref: '#/components/schemas/TimeOfDay' }
    PatchLessonRequest:
      type: object
      required: [cancelled]
      additionalProperties: false
      properties:
        cancelled: { type: boolean }
    MarkRequest:
      type: object
      required: [marks]
      additionalProperties: false
      properties:
        marks:
          type: array
          items:
            type: object
            required: [student_id, status]
            additionalProperties: false
            properties:
              student_id: { $ref: '#/components/schemas/UUID' }
              status:
                oneOf:
                  - { $ref: '#/components/schemas/AttendanceStatus' }
                  - { type: 'null' }
                description: null — снять отметку

    # ---------------------------------------------------------------- import
    ImportPreview:
      type: object
      required: [preview_id, expires_at, summary, rows]
      additionalProperties: false
      properties:
        preview_id: { $ref: '#/components/schemas/UUID' }
        expires_at: { $ref: '#/components/schemas/DateTime' }
        summary:
          type: object
          required: [total, ok, warning, error, skipped, to_import]
          additionalProperties: false
          properties:
            total: { type: integer }
            ok: { type: integer }
            warning: { type: integer }
            error: { type: integer }
            skipped: { type: integer, description: Дубликаты }
            to_import: { type: integer }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ImportRow' }
    ImportRow:
      type: object
      required: [row, status, messages, skip, full_name, parent_name, parent_phone, group, group_id, tariff,
                 tariff_id, tariff_kind, start_date, debt, lessons_left]
      additionalProperties: false
      properties:
        row: { type: integer, description: 'Номер строки как в Excel' }
        status: { type: string, enum: [ok, warning, error] }
        messages: { type: [array, 'null'], items: { type: string } }
        skip: { type: boolean, description: 'Дубликат — будет пропущен' }
        full_name: { type: string }
        parent_name: { type: string }
        parent_phone: { type: string }
        group: { type: string }
        group_id:
          $ref: '#/components/schemas/NullableUUID'
          description: null — группа будет создана
        tariff: { type: string }
        tariff_id: { $ref: '#/components/schemas/NullableUUID' }
        tariff_kind: { type: string, description: 'monthly | package | пусто, если тариф не найден' }
        start_date:
          $ref: '#/components/schemas/NullableDate'
          description: null — 1-е число текущего месяца
        debt: { $ref: '#/components/schemas/Money' }
        lessons_left: { type: [integer, 'null'] }
    ImportCommitRequest:
      type: object
      required: [preview_id]
      additionalProperties: false
      properties:
        preview_id: { $ref: '#/components/schemas/UUID' }
        first_month: { type: string, enum: [full, none], default: full }
    ImportResult:
      type: object
      required: [students_created, parents_created, groups_created, enrollments_created, skipped, debt_total]
      additionalProperties: false
      properties:
        students_created: { type: integer }
        parents_created: { type: integer }
        groups_created: { type: integer }
        enrollments_created: { type: integer }
        skipped: { type: integer }
        debt_total: { $ref: '#/components/schemas/Money' }

    # ---------------------------------------------------------------- pay
    PayLink:
      type: object
      required: [center_name, student_name, amount, provider, status, expires_at]
      additionalProperties: false
      properties:
        center_name: { type: string }
        student_name: { type: string, description: 'ФИО ученика, как записано в центре' }
        amount: { $ref: '#/components/schemas/Money' }
        provider: { type: string, enum: [manual, finik] }
        pay_details: { type: string, description: 'Реквизиты центра — только у manual' }
        status: { type: string, enum: [pending, paid] }
        expires_at: { $ref: '#/components/schemas/DateTime' }
    PayStart:
      type: object
      required: [provider, amount]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [manual, finik] }
        amount: { $ref: '#/components/schemas/Money' }
        pay_url: { type: string, format: uri, description: 'Ссылка банка (онлайн-провайдер)' }
        qr_payload: { type: string, description: 'Данные для QR (онлайн-провайдер)' }
        pay_details: { type: string, description: 'Реквизиты центра (manual)' }
