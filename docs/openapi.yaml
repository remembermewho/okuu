openapi: 3.1.0
info:
  title: Окуу API
  version: 1.0.0
  summary: Учёт оплат для учебных центров — API для фронтенда.
  license:
    name: Proprietary
  description: |
    REST + JSON. Все пути — под `/api/v1`. Источник правды по правилам — `docs/TZ.md`,
    по кодам ошибок — [docs/errors.md](errors.md). Этот файл сверяется с роутером тестом
    (`backend/internal/httpapi/openapi_test.go`): маршрут без описания здесь — тест красный.

    **Авторизация.** Сессия — httpOnly cookie `okuu_session` (SameSite=Lax, 30 дней), её ставят
    `register`, `login` и `invites/{token}/accept`. Фронтенд шлёт запросы с `credentials: "include"`.
    Без сессии защищённые маршруты отвечают `401 unauthorized`.

    **CSRF.** Для `POST`, `PUT`, `PATCH`, `DELETE` обязателен заголовок `Origin`, равный адресу
    фронтенда (`APP_ORIGIN`); иначе `403 bad_origin`. Браузер ставит его сам (из JS его задать
    нельзя), поэтому в параметрах операций он не описан — сгенерированный клиент его не требует.

    **Данные центра** — под `/api/v1/c/{centerId}`. Пользователь не из этого центра получает
    `404 not_found` (как будто центра нет), сотрудник с неподходящей ролью — `403 forbidden`.
    Роли: `owner` (владелец), `admin`, `teacher`; нужные роли — в начале описания каждой операции.
    Центр со статусом `pending` (заявка ждёт одобрения) отвечает на любой маршрут `/c/{centerId}`
    `403 center_pending`, заблокированный — `403 center_blocked`; `/me` и выход работают.

    **Панель суперадмина** — под `/api/v1/admin`, только для `is_platform_admin` (права выдаёт
    консольная команда `server admin grant`). Остальным, в том числе без входа, — `404 not_found`.

    **Деньги** — целые тыйыны (`integer`, 1 сом = 100 тыйын), со знаком там, где сказано.
    **Даты** — `string`, формат `date` (`ГГГГ-ММ-ДД`), в часовом поясе центра; моменты времени —
    `date-time` (RFC 3339). Время занятий — `ЧЧ:ММ`. Месяц — `ГГГГ-ММ`.

    **Списки** — `{"items": [...], "next_cursor": "..." | null}`. `next_cursor = null` — страница
    последняя; следующая — тем же запросом с `?cursor=<next_cursor>`. Короткие списки (тарифы,
    группы, сотрудники) отдаются целиком.

    **Ошибки** — `{"error": {"code": "...", "message": "...", "field": "..."}}`: `code` — для кода
    фронтенда, `message` — для человека (по-русски), `field` — поле запроса у `validation`.
    Для любого маршрута возможны также: 405 `method_not_allowed`, 413 `too_large` (тело больше
    1 МБ; импорт — 6 МБ), 500 `internal`.

    **Прочее.** В каждом ответе — `X-Request-ID` (тот же id — в логах сервера). Ответы API не
    кэшируются (`Cache-Control: no-store`).

servers:
  - url: /
    description: Тот же домен, что и фронтенд (Caddy проксирует /api/* на backend)

tags:
  - name: auth
    description: Регистрация, вход, профиль
  - name: invites
    description: Приглашения сотрудников (публичная страница и принятие)
  - name: pay
    description: Публичная страница оплаты родителя (без входа, по ссылке из бота)
  - name: settings
    description: Настройки центра, отчёт, журнал
  - name: staff
    description: Сотрудники и приглашения
  - name: catalog
    description: Тарифы и группы
  - name: students
    description: Ученики, родители, записи в группы
  - name: money
    description: Оплаты, отмены, история, должники, напоминания
  - name: attendance
    description: Занятия и посещаемость
  - name: import
    description: Импорт учеников из Excel/CSV
  - name: admin
    description: Панель суперадмина платформы (только агрегаты по центрам)

paths:
  # ---------------------------------------------------------------- auth
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация владельца и центра
      security: []
      description: |
        **Без входа.** Создаёт пользователя, центр и делает его владельцем (`owner`); ставит cookie сессии.
        Телефон — в любом виде (`0700 123 456`, `+996700123456`), хранится как `+996XXXXXXXXX`.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.

        Режим регистрации (`GET /auth/registration`): `invite` — только с `registration_token` из ссылки
        `{APP_ORIGIN}/register/{токен}` (иначе `403 registration_closed`); `approval` — центр создаётся
        со статусом `pending` и ждёт одобрения; `open` — свободно. По ссылке центр сразу активен в любом
        режиме, ссылка одноразовая.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Зарегистрирован; профиль
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSession' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`registration_closed` — режим `invite`, а `registration_token` нет; `bad_origin` — неверный Origin'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`registration_invalid` — ссылка регистрации использована, отозвана или устарела (14 дней)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`phone_taken` — телефон уже зарегистрирован'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/registration:
    get:
      tags: [auth]
      operationId: registrationInfo
      summary: Как устроена регистрация центров
      security: []
      description: |
        **Без входа.** Режим `REGISTRATION_MODE` и номер поддержки для кнопки WhatsApp — на странице
        регистрации без ссылки и на экранах «Заявка на рассмотрении» и «Доступ приостановлен».
      responses:
        '200':
          description: Режим и контакт поддержки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationInfo' }

  /api/v1/auth/registration/{token}:
    get:
      tags: [auth]
      operationId: checkRegistrationLink
      summary: Проверить ссылку регистрации
      security: []
      description: '**Без входа.** Для страницы `/register/{токен}`: действует ли ссылка.'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Ссылка действует
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                additionalProperties: false
                properties:
                  valid: { type: boolean, const: true }
        '404':
          description: '`registration_invalid` — ссылка использована, отозвана, устарела или неизвестна'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход
      security: []
      description: |
        **Без входа.** Ставит cookie сессии. Лимит: 5 неудачных попыток за 15 минут на телефон
        и на IP — затем `429 too_many_attempts` с `Retry-After`.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Вошёл; профиль
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSession' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: '`invalid_credentials` — неверный телефон или пароль'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '429':
          description: '`too_many_attempts` — лимит попыток входа'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выход
      security: [{}, { cookieAuth: [] }] # сессия необязательна
      description: '**Без входа** (без сессии — тоже 204). Удаляет сессию и cookie. **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.'
      responses:
        '204':
          description: Вышел
        '403': { $ref: '#/components/responses/BadOrigin' }

  /api/v1/me:
    get:
      tags: [auth]
      operationId: me
      summary: Профиль и центры пользователя
      description: '**Любой вошедший.**'
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      operationId: patchMe
      summary: Изменить своё имя
      description: |
        **Любой вошедший.** Только имя: телефон — логин, через API не меняется. Ответ — как `/me`.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchMeRequest' }
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/BadOrigin' }

  /api/v1/me/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Сменить пароль
      description: |
        **Любой вошедший.** Проверяет текущий пароль (неверный — `400 validation`, поле `current_password`),
        новый — по правилам регистрации (поле `new_password`). Лимит неудачных попыток — как у входа
        (`429 too_many_attempts` с `Retry-After`). При успехе удаляются все другие сессии пользователя,
        текущая остаётся.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Пароль изменён
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '429':
          description: '`too_many_attempts` — 5 неверных текущих паролей за 15 минут'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Выйти на всех устройствах
      description: |
        **Любой вошедший.** Удаляет все сессии пользователя, включая текущую, и cookie.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      responses:
        '204':
          description: Все сессии закрыты
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/BadOrigin' }

  # ---------------------------------------------------------------- password reset (public)
  /api/v1/password-reset/{token}:
    parameters:
      - $ref: '#/components/parameters/Token'
    get:
      tags: [auth]
      operationId: getPasswordReset
      summary: Страница сброса пароля
      security: []
      description: |
        **Без входа.** Токен — из ссылки `APP_ORIGIN/reset/<токен>` (выдаёт владелец центра или поддержка,
        действует 24 часа). Неизвестная, просроченная, отозванная и использованная ссылка — одинаково
        `404 reset_invalid`.
      responses:
        '200':
          description: Ссылка действует
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPasswordReset' }
        '404':
          description: '`reset_invalid` — ссылка недействительна'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [auth]
      operationId: completePasswordReset
      summary: Задать новый пароль по ссылке
      security: []
      description: |
        **Без входа.** Новый пароль — по правилам регистрации (поле `new_password`; при ошибке ссылка не
        расходуется). Ссылка становится использованной, все сессии пользователя удаляются — войти нужно
        с новым паролем.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPasswordRequest' }
      responses:
        '204':
          description: Пароль изменён
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '404':
          description: '`reset_invalid` — ссылка недействительна'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- invites (public)
  /api/v1/invites/{token}:
    parameters:
      - $ref: '#/components/parameters/Token'
    get:
      tags: [invites]
      operationId: getInvite
      summary: Публичная страница приглашения сотрудника
      security: []
      description: '**Без входа.** Токен — из ссылки `APP_ORIGIN/invite/<токен>`.'
      responses:
        '200':
          description: Приглашение действует
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicInvite' }
        '404':
          description: '`invite_invalid` — приглашения нет, оно использовано, отозвано или просрочено'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invites/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/Token'
    post:
      tags: [invites]
      operationId: acceptInvite
      summary: Принять приглашение
      security: [{}, { cookieAuth: [] }] # вошедший — по сессии, новый — без неё
      description: |
        **Без входа или вошедший.** Вошедший пользователь принимает без тела. Новый — с телом
        `{name, phone, password}`: создаётся пользователь и ставится cookie сессии. Ответ — как `/me`,
        с новым центром в списке.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '200':
          description: Принято; профиль
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSession' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '404':
          description: '`invite_invalid` — приглашение недействительно'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `login_required` — телефон уже зарегистрирован: войдите и примите снова;
            `already_member` — вы уже сотрудник этого центра
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- pay (public)
  /api/v1/config:
    get:
      tags: [pay]
      operationId: publicConfig
      summary: Что включено на сервере
      security: []
      description: |
        **Без входа.** `online_payments` — онлайн-оплата по ссылке (`ONLINE_PAYMENTS_ENABLED`). Выключена —
        фронтенд не показывает ничего про онлайн-оплату, а страница `/pay/:token` пишет «Онлайн-оплата
        не подключена, уточните способ оплаты у администратора».
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema:
                type: object
                required: [online_payments]
                additionalProperties: false
                properties:
                  online_payments: { type: boolean }

  /api/v1/pay/{token}:
    parameters:
      - $ref: '#/components/parameters/Token'
    get:
      tags: [pay]
      operationId: getPayLink
      summary: Страница оплаты родителя
      security: []
      description: |
        **Без входа.** Онлайн-оплата по ссылке — только при `ONLINE_PAYMENTS_ENABLED=true` (см. `GET /config`);
        выключена (по умолчанию: оплата ручная, по реквизитам из настроек центра) — любая ссылка отвечает
        `404 not_found`, как неизвестная. Ссылка — на одного ученика, на сумму его долга, действует 24 часа.
        Без телефонов и данных родителя. Лимит — 30 запросов в минуту с IP.
      responses:
        '200':
          description: Ссылка действует (или уже оплачена — `status = paid`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayLink' }
        '404':
          description: '`not_found` — ссылки нет или она истекла (ответ одинаковый)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/pay/{token}/start:
    parameters:
      - $ref: '#/components/parameters/Token'
    post:
      tags: [pay]
      operationId: startPayment
      summary: Начать оплату
      security: []
      description: |
        **Без входа.** `manual` — вернёт реквизиты центра (оплату отметит администратор);
        онлайн-провайдер (`finik`) — создаст платёж и вернёт ссылку банка / QR. Повторный вызов
        возвращает тот же платёж.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      responses:
        '200':
          description: Что делать дальше
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayStart' }
        '403': { $ref: '#/components/responses/BadOrigin' }
        '404':
          description: '`not_found` — ссылки нет или она истекла'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`already_paid` — по ссылке уже заплатили'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: '`provider_unavailable` — платёжный сервис не создал платёж (или онлайн-оплата ещё не подключена)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- settings, reports, audit
  /api/v1/c/{centerId}/settings:
    parameters:
      - $ref: '#/components/parameters/CenterId'
    get:
      tags: [settings]
      operationId: getSettings
      summary: Настройки центра
      description: '**Роли:** owner, admin.'
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [settings]
      operationId: patchSettings
      summary: Изменить настройки
      description: |
        **Роли:** owner. Частичное изменение: переданные поля меняются, `null` очищает необязательные.
        Новый `billing_day` действует со следующего месяца (`billing_day_next`, `billing_day_next_from`).
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchSettingsRequest' }
      responses:
        '200':
          description: Новые настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
