      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Сотрудники
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/c/{centerId}/staff/invites:
    parameters:
      - $ref: '#/components/parameters/CenterId'
    get:
      tags: [staff]
      operationId: listInvites
      summary: Действующие приглашения
      description: '**Роли:** owner.'
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Приглашения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [staff]
      operationId: createInvite
      summary: Пригласить сотрудника
      description: |
        **Роли:** owner. Ссылка (`url`) с одноразовым токеном — только в этом ответе; срок 7 дней.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: Приглашение создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/c/{centerId}/staff/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/InviteId'
    delete:
      tags: [staff]
      operationId: revokeInvite
      summary: Отозвать приглашение
      description: '**Роли:** owner. **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.'
      security: [{ cookieAuth: [] }]
      responses:
        '204':
          description: Отозвано
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/c/{centerId}/staff/{userId}/password-reset:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [staff]
      operationId: issuePasswordReset
      summary: Ссылка сброса пароля сотрудника
      description: |
        **Роли:** owner. Одноразовая ссылка `APP_ORIGIN/reset/<токен>` на 24 часа — только в этом ответе
        (показать с «Скопировать» и «Отправить в WhatsApp»); прежние неиспользованные ссылки этого
        сотрудника перестают работать. Разрешено, только если сотрудник состоит ТОЛЬКО в этом центре и он не
        владелец — иначе `409 reset_not_allowed` (обратиться в поддержку). Не сотрудник центра — `404`.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      responses:
        '201':
          description: Ссылка выдана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`reset_not_allowed` — сотрудник работает и в другом центре или он владелец'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/c/{centerId}/staff/invites/{inviteId}/reissue:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/InviteId'
    post:
      tags: [staff]
      operationId: reissueInvite
      summary: Новая ссылка вместо приглашения
      description: |
        **Роли:** owner. В одной транзакции отзывает приглашение (старая ссылка перестаёт работать) и создаёт
        новое с теми же ролью и именем, срок — снова 7 дней. Ссылка (`url`) — только в этом ответе.
        Отозванное, использованное или чужое приглашение — `404 not_found`.
        **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.
      security: [{ cookieAuth: [] }]
      responses:
        '201':
          description: Новое приглашение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/c/{centerId}/staff/{userId}:
    parameters:
      - $ref: '#/components/parameters/CenterId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [staff]
      operationId: changeStaffRole
      summary: Сменить роль сотрудника
      description: '**Роли:** owner. **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.'
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRoleRequest' }
      responses:
        '200':
          description: Сотрудник
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`owner_protected` — роль владельца не меняется'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [staff]
      operationId: removeStaff
      summary: Удалить сотрудника из центра
      description: '**Роли:** owner. Его сессии в этом центре больше не действуют. **Origin:** браузер обязан прислать заголовок `Origin` = `APP_ORIGIN`, иначе `403 bad_origin`.'
      security: [{ cookieAuth: [] }]
      responses:
        '204':
          description: Удалён
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaffConflict' }

