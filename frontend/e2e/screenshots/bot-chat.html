<!doctype html>
<!-- Макет чата с ботом для лендинга. Текст и кнопки подставляет landing.shot.ts из `server demo message`
     (настоящее напоминание из backend/internal/notify/texts_ru.go). Логотипов мессенджера нет. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Golos Text'; font-weight: 400; src: url(data:font/woff2;base64,{{FONT_400}}) format('woff2'); }
  @font-face { font-family: 'Golos Text'; font-weight: 600; src: url(data:font/woff2;base64,{{FONT_600}}) format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  body { background: #F4F5F1; font-family: 'Golos Text', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  .chat { width: 390px; background: #DCE6DD; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #FFFFFF; border-bottom: 1px solid #E3E6E0; }
  .back { width: 22px; height: 22px; color: #56605A; }
  .ava { width: 40px; height: 40px; border-radius: 50%; background: #1E6B47; color: #FFFFFF; display: grid; place-items: center; font-weight: 600; font-size: 18px; }
  .title { font-weight: 600; font-size: 16px; color: #17201B; }
  .sub { font-size: 13px; color: #56605A; }
  .body { padding: 16px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .day { align-self: center; background: rgba(23, 32, 27, 0.32); color: #FFFFFF; font-size: 13px; padding: 3px 10px; border-radius: 12px; margin-bottom: 6px; }
  .msg { background: #FFFFFF; border-radius: 14px 14px 14px 4px; padding: 10px 12px 6px; max-width: 340px; color: #17201B; font-size: 15px; line-height: 1.4; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(23, 32, 27, 0.08); }
  .time { display: block; text-align: right; font-size: 12px; color: #56605A; margin-top: 2px; }
  .btn { max-width: 340px; min-height: 40px; display: grid; place-items: center; padding: 8px 12px; border-radius: 10px; background: rgba(23, 32, 27, 0.36); color: #FFFFFF; font-size: 14px; font-weight: 600; text-align: center; }
  .input { margin: 6px 12px 12px; height: 44px; border-radius: 22px; background: #FFFFFF; color: #56605A; font-size: 15px; display: flex; align-items: center; padding: 0 16px; }
</style>
</head>
<body>
  <div class="chat">
    <div class="head">
      <svg class="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <div class="ava">{{INITIAL}}</div>
      <div><div class="title">{{BOT}}</div><div class="sub">бот</div></div>
    </div>
    <div class="body">
      <div class="day">Сегодня</div>
      <div class="msg">{{TEXT}}<span class="time">{{TIME}}</span></div>
      {{BUTTONS}}
    </div>
    <div class="input">Сообщение</div>
  </div>
</body>
</html>
